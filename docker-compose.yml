version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_PATH=/data/irents.db
      - APP_API_KEY=${APP_API_KEY:-changeme-local-dev}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=development
    volumes:
      - backend_data:/data
    restart: unless-stopped

  frontend:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_URL=http://backend:4000
      - NEXT_PUBLIC_APP_NAME=iRents Site Machine
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
